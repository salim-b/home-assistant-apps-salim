#:schema https://www.schemastore.org/ruff.json

# Python linter + formatter for the .mise/tasks scripts (hk ruff/ruff-format steps; `mise run fmt`).
# Conventions and rule-family rationale: .agents/skills/ha-app-tooling ("Python linting: ruff").

[lint]
  # extend-select over ruff's default rule set - the gate tracks ruff's canonical upstream defaults.
  # Selection whys, the formatter-conflict rule and the noqa policy: .agents/skills/ha-app-tooling.
  extend-select = [
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "B",
    "W",
    "C4",
    "UP",
    "N",
    "A",
    "EXE",
    "RET504",
    "ISC002",
    "ISC003",
    "S307",
    "S603",
    "S607",
    "S310",
    "EM",
    "TRY",
    "PTH",
    "ANN",
    "D",
    "RUF100",
    "PGH004",
  ]

  [lint.pydocstyle]
    convention = "google"

  [lint.pycodestyle]
    # panache wraps Markdown prose at 120 (skill ha-app-tooling); the formatter stays at ruff's 88.
    max-line-length = 120
