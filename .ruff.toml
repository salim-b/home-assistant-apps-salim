#:schema https://www.schemastore.org/ruff.json

# Ruff configuration - Python linter + formatter for the .mise/tasks scripts, run by the hk
# ruff/ruff-format steps (pre-commit + `mise run lint`); `mise run fmt` runs `ruff format .`.
# Conventions: .agents/skills/ha-app-tooling

# Formatter and quote style stay at ruff's defaults (4-space indent, double quotes, 88 columns):
# ruff does not read .editorconfig, but its defaults match this repo's Python style.

# target-version is deliberately NOT pinned: it is inert for the selected rule families (none of
# E4/E7/E9/F/I/B is version-sensitive), and nothing couples this file to the `python` pin in
# mise.toml [tools] - a pin here would only drift as Python moves on. Ruff's own default applies,
# which is the conservative direction (no false positives on newer syntax); revisit only when
# adopting target-sensitive rule families such as UP.

[lint]
  # Pinned explicitly: ruff 0.17.0 expanded the default rule selection and keeps drifting with
  # releases (ruff CHANGELOG 0.17.0, astral-sh/ruff#28786) - the gate must not move with it.
  # E4/E7/E9 pycodestyle errors + F pyflakes is the classic core; I import order (auto-fixable);
  # B bugbear real-bug checks; W invalid escape sequences and whitespace; C4 comprehension
  # idioms; S307 marks the deliberate eval() sites (the `# noqa: S307` comments in
  # validate/apps.py go live with it); RUF100 + PGH004 keep noqa directives honest.
  select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "W",
    "C4",
    "S307",
    "RUF100",
    "PGH004",
  ]
