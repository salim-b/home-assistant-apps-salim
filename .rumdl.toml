#:schema https://raw.githubusercontent.com/rvben/rumdl/main/rumdl.schema.json

[global]
  # https://rumdl.dev/global-settings/
  editorconfig = true
  # Open Home Foundation policy text, kept verbatim for upstream syncs (mirrors panache's exclude).
  exclude = [ "AI_POLICY.md" ]
  # rumdl must never rewrite files – panache owns ALL Markdown formatting. Inert `all` sentinel canary
  # (validate/apps.py fails loudly if a rumdl upgrade flips this): .agents/skills/ha-app-markdown.
  fixable = [ "all" ]

[per-file-ignores]
  # https://rumdl.dev/global-settings/#per-file-ignores

[MD013]
  # https://rumdl.dev/md013/
  code-block-line-length = 0
  code-spans = false
  # Panache owns prose wrapping; MD013 stays a pure width check (why: .agents/skills/ha-app-markdown).
  line-length = 120

[MD033]
  # https://rumdl.dev/md033/
  allowed_elements = [ "details", "kbd", "summary" ]
  table_allowed_elements = [ "br", "details", "kbd", "summary" ]
