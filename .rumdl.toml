# rumdl configuration - Markdown linter (https://github.com/rvben/rumdl)
#
# Runs as part of `mise run lint` (all git-tracked .md files); `mise exec
# rumdl -- rumdl fmt .` applies auto-fixes. The config is schema-validated
# against rumdl's published JSON schema (see .mise/tasks/validate.py).

[global]
# AI_POLICY.md is the Open Home Foundation's policy text, kept verbatim for
# upstream syncs - not this repo's prose to style: excluded from linting
# entirely.
exclude = ["AI_POLICY.md"]

# Line length enforced (MD013, see its section below). READMEs ignore MD033:
# badges/my.home-assistant.io embeds are conventional GitHub README content.
[per-file-ignores]
"README.md" = ["MD033"]

[MD013]
line-length = 120
# Code is not prose: fenced/indented code blocks (shell commands, config
# snippets) keep their natural length.
code-block-line-length = 0
# A line whose only overflow is an unbreakable inline code span must not
# fail the check (nothing to wrap without rewriting the code).
code-spans = false
# `normalize` reflow: fmt wraps ALL paragraph prose to consistently fill
# 120 - overlong lines are wrapped AND short wrapped lines are joined, so
# every paragraph ends up uniformly wrapped (rendered text unchanged: soft
# breaks render as spaces). One-time normalization churn for previously
# hard-wrapped files; afterwards, run fmt instead of hand-wrapping.
# Never rewrites a line the check itself forgives (URL/code-span-only
# overruns etc.).
reflow = true
reflow-mode = "normalize"
reflow-length-exemptions = true
