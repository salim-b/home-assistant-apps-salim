# rumdl configuration - Markdown linter (https://github.com/rvben/rumdl)
#
# Second, markdownlint-rules-rich linter behind panache (see panache.toml),
# which owns ALL markdown autoformatting. Runs as part of `mise run lint`
# (all git-tracked .md files); the config is schema-validated against
# rumdl's published JSON schema (see .mise/tasks/validate.py).

[global]
# AI_POLICY.md is the Open Home Foundation's policy text, kept verbatim for
# upstream syncs - not this repo's prose to style: excluded from linting
# entirely.
exclude = ["AI_POLICY.md"]

# Line length enforced (MD013, see its section below). READMEs ignore MD033:
# badges/my.home-assistant.io embeds are conventional GitHub README content.
[per-file-ignores]
"README.md" = ["MD033"]

[MD013]
line-length = 120
# Code is not prose: fenced/indented code blocks (shell commands, config
# snippets) keep their natural length.
code-block-line-length = 0
# A line whose only overflow is an unbreakable inline code span must not
# fail the check (nothing to wrap without rewriting the code).
code-spans = false
# Panache (see panache.toml) owns prose wrapping, so rumdl's own reflow
# stays off - its documented default (`reflow = false`). MD013 remains as
# a pure width check: flag lines over the limit, never rewrite them.
# Without this, rumdl would enforce ITS normalized fill state, which
# disagrees with panache's packing.
