name: Build app

on:
  workflow_call:
    inputs: &shared_inputs
      app:
        description: Name of the app to be built. Must correspond to the app's subfolder name in the repository.
        required: true
        type: string
      publish:
        description: Whether or not to publish the built image to GHCR.
        required: true
        type: boolean
    secrets:
      # Passed explicitly by the caller (builder.yaml avoids secrets: inherit). Direct
      # workflow_dispatch runs (publish-reconcile) fall back to the implicit GITHUB_TOKEN,
      # hence required: false.
      GITHUB_TOKEN:
        description: GitHub token for GHCR authentication in the build/manifest jobs.
        required: false
  # Manual/reconcile dispatch: publish-reconcile fires this when a version tag is missing from
  # GHCR. workflow_dispatch is the documented GITHUB_TOKEN exception that always creates runs
  # (not subject to the push-event workflow suppression).
  workflow_dispatch:
    inputs: *shared_inputs

permissions:
  # Baseline for jobs without their own permissions block (prepare is read-only); the build and
  # manifest jobs declare their elevated grants at job level. As a reusable workflow these must
  # not exceed what callers grant (builder.yaml: contents/id-token/packages).
  contents: read

concurrency:
  # github.workflow is the CALLER's name inside a called workflow, and each called run evaluates
  # this group - inputs.app keeps the caller's per-app matrix children in distinct groups so they
  # do not cancel each other, and the caller (builder.yaml) uses a -caller suffix so the two
  # never share a group (mutual cancellation would deadlock, GitHub docs).
  group: ${{ github.workflow }}-${{ inputs.app }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'salim-b/home-assistant-apps-salim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        # helpers/info emits its string outputs JSON-quoted (`yq -o=json`); env values keep those
        # quotes, so they are unquoted with jq (which also handles escapes). Referencing the raw
        # outputs directly in the script would be a template-injection surface (zizmor).
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_URL: ${{ steps.info.outputs.url }}
        run: |
          image=$(jq -r . <<<"${INFO_IMAGE}")
          url=$(jq -r . <<<"${INFO_URL}")
          {
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=$(jq -r . <<<"${INFO_VERSION}")"
            echo "name=$(jq -r . <<<"${INFO_NAME}")"
            echo "description=$(jq -r . <<<"${INFO_DESCRIPTION}")"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-pull the buildkit driver image (Docker Hub flake hardening)
        # setup-buildx-action (used internally by the builder) pulls the buildkit driver from
        # Docker Hub; transient auth.docker.io outages fail the whole job - pre-pull with retries
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_seconds: 300
          command: docker pull moby/buildkit:buildx-stable-1

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
