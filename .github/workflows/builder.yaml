name: Builder

env:
  # apparmor.txt and translations/ are deliberately absent: the supervisor consumes both from the app repository, not
  # from the image, so changing them needs no image rebuild. config.yaml stays because its version bump is what
  # publishes the tag (version-guard requires one for any device-visible change). .dockerignore (the per-app
  # build-context allow-list) is included like the Dockerfile: a change that breaks the context — e.g. dropping
  # rootfs/ — must fail CI in the PR that introduced it, not at a later release; no-op changes just cache-hit.
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile .dockerignore rootfs"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Per-PR/ref cancellation; the -caller suffix keeps this group distinct from build-app.yaml's
  # own group (a called workflow sees the caller's name in github.workflow, so an unmodified
  # ${{ github.workflow }} prefix would put both in one group and cancel each other).
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          changed_apps=()

          # If the workflow file itself changed, rebuild all apps
          if [[ "${CHANGED_FILES}" =~ \.github/workflows/(builder|build-app)\.yaml ]]; then
            # shellcheck disable=SC2206  # APPS is a space-separated list
            changed_apps=(${APPS})
          else
            for app in ${APPS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${app}/${file} ]]; then
                  changed_apps+=("${app}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: $/.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
      # No secrets block: GITHUB_TOKEN is automatically available in the called workflow.
