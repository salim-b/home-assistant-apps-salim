name: Action bump security review

# AI review of the GitHub Actions bumps Renovate proposes; mechanics and facts:
# root KNOWLEDGE.md §"CI: AI supply-chain review of action bumps". Shadow phase:
# the verdict gates nothing yet – bump PRs stay manually merged.

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      model:
        description: Copilot model override
        required: false
        type: string

permissions: {}

concurrency:
  group: >-
    action-bump-review-${{ github.event_name == 'workflow_dispatch' &&
    inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Action supply-chain review (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.pull_request.head.ref, 'renovate/') &&
       !github.event.pull_request.head.repo.fork)
    env:
      GH_TOKEN: ${{ github.token }}
      # gh resolves the repository from the working directory's git remote –
      # but the early steps run before any checkout, on a bare workspace.
      # Pin the context so `gh pr view` works there.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve review target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr="$EVENT_PR"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            pr="$DISPATCH_PR"
          fi
          json=$(gh pr view "$pr" --json number,baseRefOid,headRefOid)
          {
            echo "pr=$(jq -r '.number' <<<"$json")"
            echo "base=$(jq -r '.baseRefOid' <<<"$json")"
            echo "head=$(jq -r '.headRefOid' <<<"$json")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.target.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard review tooling against automated PRs
        env:
          BASE: ${{ steps.target.outputs.base }}
          HEAD: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail

          # The job executes repo content from the PR checkout (the verdict
          # script) and installs the PR's mise toolset, so automated bump PRs
          # must not touch any of it: such a change is reviewed by a human,
          # never by itself. This runs before any tool install.
          if git diff --name-only "$BASE" "$HEAD" -- \
               .github/agents/ .github/scripts/ mise.toml mise.lock | grep -q .; then
            echo "::error::Automated PR modifies review tooling or the toolset it runs – human review required"
            exit 1
          fi

          # Renovate's github-actions manager rewrites a digest bump together
          # with the pin's trailing version comment (verified on PR #29) and
          # only ever touches `uses:` pin lines – precisely the change the
          # review assesses. Normalizing a digest that is followed only by
          # whitespace (the version comment) or end of line therefore passes
          # digest+comment rewrites of any pin, while any other change to the
          # file – new steps, changed arguments, a dropped guard – is
          # tampering. A digest repointed to a longer ref (hex extension or
          # non-hex suffix) or to a floating ref fails to normalize and
          # trips, failing closed.
          sanitize() {
            # A revision predating this file (dispatch on an older PR) yields
            # empty output on both sides and passes the comparison.
            git show "$1:.github/workflows/action-bump-review.yaml" 2>/dev/null |
              sed -E 's/(uses:[[:space:]]*[^@[:space:]]+)@[0-9a-f]{40}([[:space:]].*)?$/\1@DIGEST/'
          }
          if [ "$(sanitize "$BASE")" != "$(sanitize "$HEAD")" ]; then
            echo "::error::Automated PR modifies this review workflow – human review required"
            exit 1
          fi

      - name: Check out the revision this workflow runs at
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: review-src
          persist-credentials: false

      - name: Materialize trusted review tooling
        run: |
          set -euo pipefail

          # The guard proved the PR did not touch these paths; on dispatch
          # runs against PRs predating them they may not exist in the PR
          # checkout at all. Copy them from the revision this workflow runs
          # at, so the agent definition, the review scripts and the tool pins
          # always come from the trusted revision.
          mkdir -p .github/agents .github/scripts
          cp review-src/.github/agents/action-supply-chain-review.md .github/agents/
          cp review-src/.github/scripts/review_verdict.py .github/scripts/
          cp review-src/.github/scripts/review_input.py .github/scripts/
          cp review-src/mise.toml review-src/mise.lock .

      - name: Set up mise (provides the pinned Copilot CLI)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          install_args: --include-lazy

      - name: Collect bumped action references
        env:
          BASE: ${{ steps.target.outputs.base }}
          HEAD: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP"

          # Collect owner/repo[/path]@ref pins with their workflow file from
          # every workflow at both revisions. Local self-repository refs
          # ($/...), ./... and docker:// sources are not dependency pins; refs
          # without a digest (e.g. @master) are floating and surface as
          # nondigest anomalies.
          collect() {
            git grep -E 'uses:' "$1" -- .github/workflows \
              | awk -v rev="$1" '{
                  line = $0
                  if (substr(line, 1, length(rev) + 1) == rev ":") {
                    line = substr(line, length(rev) + 2)
                  }
                  i = index(line, ":")
                  file = substr(line, 1, i - 1)
                  rest = substr(line, i + 1)
                  if ((j = index(rest, "uses:")) == 0) next
                  rest = substr(rest, j + 5)
                  sub(/[[:space:]]*#.*/, "", rest)
                  gsub(/^[[:space:]"'"'"']+|[[:space:]"'"'"']+$/, "", rest)
                  if (rest ~ /^(docker:\/\/|\.\/|\$\/)/) next
                  if (rest !~ /^[A-Za-z0-9_.-]+(\/[A-Za-z0-9_.-]+)+@/) next
                  slug = rest
                  sub(/@.*$/, "", slug)
                  ref = rest
                  sub(/^[^@]*@/, "", ref)
                  print file "\t" slug "\t" ref
                }' || true
          }
          collect "$BASE" > "$scratch/old-details.tsv"
          collect "$HEAD" > "$scratch/new-details.tsv"
          python3 .github/scripts/review_verdict.py classify \
            "$scratch/old-details.tsv" "$scratch/new-details.tsv" "$scratch/entries.tsv"

      - name: Review bumped actions
        id: review
        env:
          BASE: ${{ steps.target.outputs.base }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          MODEL_OVERRIDE: ${{ inputs.model }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP"
          entries="$scratch/entries.tsv"

          # The comment and the job summary are built in parallel: each
          # section lands in both as soon as it exists, so a timed-out or
          # otherwise aborted run still shows the verdicts completed so far.
          {
            echo '## 🤖 AI supply-chain review (shadow phase)'
            echo
            echo '> **Shadow mode** – this verdict gates nothing yet: the PR is merged by a human exactly as'
            echo '> before. Once verdict quality is validated, this check becomes the gate that Renovate'
            echo '> automerge waits for.'
            echo
          } > "$scratch/banner.md"
          cp "$scratch/banner.md" "$scratch/comment.md"
          cat "$scratch/banner.md" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          risky_seen=0
          idx=0

          if [[ ! -s "$entries" ]]; then
            {
              echo '> No action reference changes between base and head – nothing to review.'
              echo
            } >> "$scratch/comment.md"
            {
              echo '> No action reference changes between base and head – nothing to review.'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No action reference changes between base and head – nothing to review."
          fi

          # Renovate's pull-request description carries upstream release-note
          # summaries; the reviewer reads it as untrusted context.
          prbody="$scratch/prbody.md"
          gh pr view "$PR_NUMBER" --json body --jq '.body // empty' > "$prbody" 2>/dev/null || true

          while IFS=$'\t' read -r etype slug old new; do
            [[ -z "$etype" ]] && continue
            idx=$((idx + 1))
            section="$scratch/section-$idx.md"

            if [[ "$etype" != "review" ]]; then
              case "$etype" in
                added)
                  {
                    echo "### $idx. \`$slug\`"
                    echo
                    echo "- ❗ **Policy: manual review** – an action was *added* (\`$new\`) in an automated"
                    echo '  bump PR; Renovate only bumps existing pins, so this is unexpected.'
                  } > "$section"
                  failed=1
                  ;;
                removed)
                  {
                    echo "### $idx. \`$slug\`"
                    echo
                    echo "- ℹ️ Action reference removed (\`$old\`); informational only."
                  } > "$section"
                  ;;
                nondigest)
                  {
                    echo "### $idx. \`$slug\`"
                    echo
                    echo "- ❗ **Policy: manual review** – reference moved to a non-digest value"
                    echo "  (\`$old\` → \`$new\`); digest review does not apply."
                  } > "$section"
                  failed=1
                  ;;
                ambiguous)
                  {
                    echo "### $idx. \`$slug\`"
                    echo
                    echo "- ❗ **Policy: manual review** – the pin holds multiple digests across the two"
                    echo "  revisions (\`$old\` → \`$new\`); the actual replacements cannot be"
                    echo '  determined unambiguously.'
                  } > "$section"
                  failed=1
                  ;;
              esac
              {
                cat "$section"
                echo
              } >> "$scratch/comment.md"
              {
                cat "$section"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Popular GitHub-owned actions are excluded from AI review by
            # policy: their bumps gate on Renovate's minimum release age
            # instead (see .github/renovate.json) – an AI verdict would
            # systematically fail closed on their minified dist bundles,
            # whose diffs the compare API does not provide, blocking
            # automerge without adding signal. Keep the slug list in sync
            # with .github/renovate.json's release-age rules.
            case "$slug" in
              actions/* | jdx/mise-action)
                {
                  echo "### $idx. \`$slug\`"
                  echo
                  echo "- ℹ️ **Excluded from AI review by policy** – \`${slug}\` bumps gate on Renovate's"
                  echo "  minimum release age instead (see \`.github/renovate.json\`)."
                } > "$section"
                {
                  cat "$section"
                  echo
                } >> "$scratch/comment.md"
                {
                  cat "$section"
                  echo
                } >> "$GITHUB_STEP_SUMMARY"
                continue
                ;;
            esac

            if ((risky_seen)); then
              {
                echo "### $idx. \`$slug\`"
                echo
                echo '- ⚠️ Not reviewed – an earlier entry was risky or failed closed; address that one first.'
              } > "$section"
              {
                cat "$section"
                echo
              } >> "$scratch/comment.md"
              {
                cat "$section"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # The compare API is keyed by owner/repo; subpath actions share it.
            repo=$(printf '%s' "$slug" | cut -d/ -f1-2)
            compare="$scratch/compare-$idx.json"
            ok=0
            for _ in 1 2; do
              if gh api "repos/$repo/compare/$old...$new" > "$compare"; then
                ok=1
                break
              fi
              sleep 10
            done
            if [[ "$ok" != 1 ]]; then
              {
                echo "### $idx. \`$slug\`"
                echo
                echo '- ⚠️ **Policy: manual review** – the upstream compare could not be fetched; nothing was reviewed.'
              } > "$section"
              failed=1
              {
                cat "$section"
                echo
              } >> "$scratch/comment.md"
              {
                cat "$section"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # The compare API omits per-file patches for oversized files –
            # for bundle-shipping actions exactly the code that executes (root
            # KNOWLEDGE.md §"CI: AI supply-chain review of action bumps").
            # Reconstruct those diffs trusted-side from git blobs:
            # files[].sha is the new side's blob, one trees call maps the old
            # side. *.map files are skipped as derivative of the src/ patches
            # and the file count is capped; the manifest drives
            # review_input.py's diff-phase reconstructions.
            blob_manifest="$scratch/blob-manifest-$idx.tsv"
            : > "$blob_manifest"
            mapfile -t omitted_files < <(
              jq -r '.files[]
                     | select(.patch == null)
                     | [.filename, (.previous_filename // ""), .status, (.sha // "")]
                     | @tsv' "$compare" 2>>"$scratch/err-$idx.log" || true
            )
            old_tree="$scratch/old-tree-$idx.json"
            tree_ok=0
            if (( ${#omitted_files[@]} )); then
              if gh api "repos/$repo/git/trees/$old?recursive=1" > "$old_tree" 2>>"$scratch/err-$idx.log"; then
                tree_ok=1
              fi
            fi
            blob_n=0
            for omitted in "${omitted_files[@]}"; do
              IFS=$'\t' read -r bfile bprev bstatus bsha <<<"$omitted"
              if ((blob_n >= 4)); then
                printf '%s\t\t\treconstruction skipped: cap of 4 files reached\n' "$bfile" >> "$blob_manifest"
                continue
              fi
              case "$bfile" in
                *.map)
                  printf '%s\t\t\tskipped: source map (derivative of the src/ patches)\n' "$bfile" >> "$blob_manifest"
                  continue
                  ;;
              esac
              if [[ "$bstatus" == "removed" ]]; then
                printf '%s\t\t\tremoved between the pins; content not reconstructed\n' "$bfile" >> "$blob_manifest"
                continue
              fi
              if [[ -z "$bsha" ]]; then
                printf '%s\t\t\treconstruction unavailable: no blob sha in the compare response\n' "$bfile" >> "$blob_manifest"
                continue
              fi
              blob_old="$scratch/blob-old-$idx-$blob_n"
              blob_new="$scratch/blob-new-$idx-$blob_n"
              old_f=""
              new_f=""
              if [[ "$bstatus" != "added" ]]; then
                if (( ! tree_ok )); then
                  printf '%s\t\t\treconstruction unavailable: the old-revision tree listing failed\n' "$bfile" >> "$blob_manifest"
                  continue
                fi
                old_sha=$(jq -r --arg f "${bprev:-$bfile}" \
                  '.tree[] | select(.path == $f) | .sha // empty' "$old_tree" 2>>"$scratch/err-$idx.log" || true)
                if [[ -n "$old_sha" ]] && gh api "repos/$repo/git/blobs/$old_sha" --jq .content \
                  2>>"$scratch/err-$idx.log" | base64 -d > "$blob_old" 2>>"$scratch/err-$idx.log"; then
                  old_f="$blob_old"
                fi
                if [[ -z "$old_f" ]]; then
                  printf '%s\t\t\treconstruction unavailable: the old blob could not be fetched\n' "$bfile" >> "$blob_manifest"
                  continue
                fi
              fi
              if gh api "repos/$repo/git/blobs/$bsha" --jq .content 2>>"$scratch/err-$idx.log" |
                base64 -d > "$blob_new" 2>>"$scratch/err-$idx.log"; then
                new_f="$blob_new"
              fi
              if [[ -z "$new_f" ]]; then
                printf '%s\t\t\treconstruction unavailable: the new blob could not be fetched\n' "$bfile" >> "$blob_manifest"
                continue
              fi
              printf '%s\t%s\t%s\t\n' "$bfile" "$old_f" "$new_f" >> "$blob_manifest"
              blob_n=$((blob_n + 1))
            done

            # Privilege context: the BASE-revision workflows referencing this
            # action – the triggers and permissions the bumped code runs
            # under. Deterministic order; capped per file and in file count.
            priv="$scratch/priv-$idx.raw"
            : > "$priv"
            priv_count=0
            while IFS= read -r wffile; do
              [[ -z "$wffile" ]] && continue
              if ((priv_count >= 6)); then
                echo '(further referencing workflow files omitted)' >> "$priv"
                break
              fi
              {
                echo "-----8<----- workflow: $wffile"
                git show "$BASE:$wffile" 2>/dev/null | head -c 10000 || true
                echo
              } >> "$priv"
              priv_count=$((priv_count + 1))
            done < <(git grep -lF "$slug@" "$BASE" -- .github/workflows 2>/dev/null | sed -E "s/^$BASE://" || true)

            # Bounded upstream metadata for the tag/release reality check:
            # newest 100 tags and newest 10 releases; a failed fetch leaves
            # the section marked unavailable in the input file.
            tags_ok=0
            rel_ok=0
            if gh api "repos/$repo/tags?per_page=100" > "$scratch/tags-$idx.json" 2>>"$scratch/err-$idx.log"; then
              tags_ok=1
            fi
            if gh api "repos/$repo/releases?per_page=10" > "$scratch/releases-$idx.json" 2>>"$scratch/err-$idx.log"; then
              rel_ok=1
            fi

            # The trusted script assembles the input under the 500000-byte
            # budget: the diff first (a truncated diff carries the explicit
            # unreviewable marker; omitted patches arrive as reconstructed
            # blob diffs via the manifest), context sections appended in
            # priority order while the budget has room.
            input_file=".review-input-$idx.txt"
            enrich_args=(
              enrich --budget 500000
              --compare "$compare"
              --repo "$repo"
              --slug "$slug"
              --old "$old"
              --new "$new"
              --out "$input_file"
            )
            if ((tags_ok)); then enrich_args+=(--tags "$scratch/tags-$idx.json"); fi
            if ((rel_ok)); then enrich_args+=(--releases "$scratch/releases-$idx.json"); fi
            if [[ -s "$priv" ]]; then enrich_args+=(--privileges "$priv"); fi
            if [[ -s "$prbody" ]]; then enrich_args+=(--prbody "$prbody"); fi
            if [[ -s "$blob_manifest" ]]; then enrich_args+=(--blob-manifest "$blob_manifest"); fi
            python3 .github/scripts/review_input.py "${enrich_args[@]}"

            prompt='Perform the action-bump security review described in your instructions. The review'
            prompt+=' input file is: '"$input_file"' (read it with your file-read tool). Reply with the'
            prompt+=' JSON verdict object only.'
            cop_args=(
              --agent action-supply-chain-review
              --trust-folder
              --no-custom-instructions
              --disable-builtin-mcps
              --no-ask-user
              --disallow-temp-dir
              --deny-tool shell
              --deny-tool write
              --deny-tool memory
              --secret-env-vars GITHUB_TOKEN GH_TOKEN
              --reasoning-effort high
              --max-ai-credits 300
              --usage-output-file "$scratch/usage-$idx.json"
            )
            if [[ -n "$MODEL_OVERRIDE" ]]; then
              cop_args+=(--model "$MODEL_OVERRIDE")
            fi

            set +e
            out=$(copilot "${cop_args[@]}" -p "$prompt" -s 2>"$scratch/err-$idx.log")
            rc=$?
            set -e
            printf '%s' "$out" > "$scratch/raw-$idx.txt"

            python3 .github/scripts/review_verdict.py extract \
              "$scratch/raw-$idx.txt" "$scratch/verdict-$idx.json"

            verdict=$(jq -r '.verdict' "$scratch/verdict-$idx.json")
            case "$verdict" in
              clean) mark="✅ clean" ;;
              risky) mark="⚠️ risky"; failed=1; risky_seen=1 ;;
              *) mark="❌ $verdict (fail-closed)"; failed=1; risky_seen=1 ;;
            esac

            python3 .github/scripts/review_verdict.py render \
              "$scratch/verdict-$idx.json" "$idx" "$slug" "$old" "$new" "$mark" "$section"

            if ((rc != 0)); then
              {
                echo
                echo '> ⚠️ Reviewer process exited nonzero; the verdict above may be incomplete'
                echo '> (fail-closed already applied where parsing failed).'
              } >> "$section"
            fi
            {
              cat "$section"
              echo
            } >> "$scratch/comment.md"
            {
              cat "$section"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$entries"

          {
            echo
            echo '<details><summary>Run metadata</summary>'
            echo
            echo '```text'
            echo "CLI: $(copilot --version 2>/dev/null | head -n1)"
            for u in "$scratch"/usage-*.json; do
              [[ -e "$u" ]] || continue
              echo "usage($(basename "$u")): $(jq -c '.' "$u")"
            done
            echo '```'
            echo
            echo '</details>'
          } > "$scratch/metadata.md"
          cat "$scratch/metadata.md" >> "$scratch/comment.md"
          cat "$scratch/metadata.md" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr comment "$PR_NUMBER" --body-file "$scratch/comment.md"
          fi

          if ((failed)); then
            echo '::error::AI supply-chain review flagged risk or could not complete – see the PR comment'
            exit 1
          fi

      - name: Upload review diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: action-bump-review-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/banner.md
            ${{ runner.temp }}/comment.md
            ${{ runner.temp }}/metadata.md
            ${{ runner.temp }}/entries.tsv
            ${{ runner.temp }}/compare-*.json
            ${{ runner.temp }}/tags-*.json
            ${{ runner.temp }}/releases-*.json
            ${{ runner.temp }}/priv-*.raw
            ${{ runner.temp }}/old-tree-*.json
            ${{ runner.temp }}/blob-manifest-*.tsv
            ${{ runner.temp }}/blob-old-*
            ${{ runner.temp }}/blob-new-*
            ${{ runner.temp }}/prbody.md
            ${{ runner.temp }}/err-*.log
            ${{ runner.temp }}/raw-*.txt
            ${{ runner.temp }}/verdict-*.json
            ${{ runner.temp }}/usage-*.json
            ${{ runner.temp }}/section-*.md
            .review-input-*.txt
