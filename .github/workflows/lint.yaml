name: Lint and validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        id: lint
        # The action builds its lint image from Docker Hub at run time;
        # transient auth.docker.io outages (observed: 504 on the token
        # fetch) otherwise fail the whole run — try once more after a
        # wait before giving up.
        continue-on-error: true
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

      - name: ⏳ Wait before retrying the linter
        if: steps.lint.outcome == 'failure'
        run: sleep 60

      - name: 🚀 Run Home Assistant App Lint (retry)
        if: steps.lint.outcome == 'failure'
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

  check:
    name: Mise check (lint + validate)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Set up mise (installs pinned tools via mise.lock)
        uses: jdx/mise-action@v5

      - name: ✅ Run mise tasks (lint + validate)
        run: mise run check
