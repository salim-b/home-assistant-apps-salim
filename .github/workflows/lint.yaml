name: Lint and validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  # Read-only gate: checkout + the linters; no GITHUB_TOKEN writes needed.
  contents: read

concurrency:
  # Per-PR/ref cancellation: a newer push superseding older runs of the same PR/branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    timeout-minutes: 10
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⤵️ Check out the linter source
        # run frenck's app linter natively instead of via its Docker action, whose Docker Hub
        # image builds flake on transient auth.docker.io outages/429 rate limits; Renovate
        # digest-pins this checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frenck/action-addon-linter
          ref: v2.21
          path: linter
          persist-credentials: false

      - name: 🐍 Install the linter requirements
        run: python3 -m pip install --no-cache-dir --prefer-binary -r linter/src/requirements.txt

      - name: 🚀 Run Home Assistant App Lint
        # lint.py reads its configuration from the GitHub action-input env convention (INPUT_*):
        # `path` is the app directory, `community` stays false (the action's default). The two
        # JSON schemas are loaded from absolute paths (the Docker image copied them to /) - provide them.
        env:
          # matrix values are plain strings (no JSON quoting) - safe to pass through env:.
          INPUT_PATH: "./${{ matrix.path }}"
        run: |
          sudo cp linter/src/config.schema.json linter/src/build.schema.json /
          INPUT_COMMUNITY="false" \
            python3 linter/src/lint.py

  check:
    name: Mise check (lint + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up mise (installs pinned tools via mise.lock)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5

      - name: ✅ Run mise tasks (lint + validate)
        run: mise run check
