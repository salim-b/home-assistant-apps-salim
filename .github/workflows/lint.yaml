name: Lint and validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: ⤵️ Check out the linter source
        # run frenck's app linter natively instead of via its Docker action:
        # the action builds its image from Docker Hub at run time, where
        # transient auth.docker.io outages/429 rate limits (runner IP pools,
        # unauthenticated pulls) otherwise flake the job — python + pypi are
        # the reliable path. Renovate digest-pins this checkout.
        uses: actions/checkout@v7.0.1
        with:
          repository: frenck/action-addon-linter
          ref: v2.21
          path: linter

      - name: 🐍 Install the linter requirements
        run: python3 -m pip install --no-cache-dir --prefer-binary -r linter/src/requirements.txt

      - name: 🚀 Run Home Assistant App Lint
        run: python3 linter/src/lint.py "./${{ matrix.path }}"

  check:
    name: Mise check (lint + validate)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: ⚙️ Set up mise (installs pinned tools via mise.lock)
        uses: jdx/mise-action@v5

      - name: ✅ Run mise tasks (lint + validate)
        run: mise run check
