name: Publish reconcile

# Daily reconciliation of the published GHCR state against main's app configs: every app's version
# tag must exist in the registry (per-arch images + multi-arch manifest). A missing tag (e.g. a
# transient build/publish failure on the push-fired Builder) is self-healed by dispatching
# build-app.yaml (publish=true, ref=main) - only a real miss dispatches, so a healthy registry is a
# green no-op run; the dispatched Builder run is the loud signal when publishing keeps failing.
# GHCR unreachable (after backoff retries) or a failed dispatch fails this run (red).
#
# Known limitation: reconciles TAG EXISTENCE only - stale tag content is version-guard's and
# validate.py's domain (both fail loudly on source drift).
#
# Cron offset: 03:15 UTC - away from the lint cron (00:00) and the apk-bump nudge (01:30). GHCR is
# probed anonymously with the runner's preinstalled docker buildx CLI (public packages; only
# ghcr.io supported); unclassified probe failures are retried with exponential backoff.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-reconcile
  cancel-in-progress: false

jobs:
  find:
    name: Find apps
    if: github.repository == 'salim-b/home-assistant-apps-salim'
    runs-on: ubuntu-latest
    outputs:
      addons_list: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  reconcile:
    name: Reconcile ${{ matrix.app }}
    needs: find
    if: github.repository == 'salim-b/home-assistant-apps-salim'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.find.outputs.addons_list) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.app }}"

      - name: Normalize app information
        id: normalize
        run: |
          # helpers/info emits its string outputs JSON-quoted (`yq -o=json`); shell-assigning the
          # interpolated output strips the quotes (same pattern as build-app.yaml; never feed raw
          # outputs to env: - they keep their quotes).
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check published tags in GHCR
        id: tags
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ steps.normalize.outputs.version }}
          REGISTRY_PREFIX: ${{ steps.normalize.outputs.registry_prefix }}
          IMAGE_NAME: ${{ steps.normalize.outputs.image_name }}
          ARCHITECTURES: ${{ steps.info.outputs.architectures }}
        run: |
          set -euo pipefail

          # Existence probe via the runner's preinstalled docker buildx CLI (talks to the registry
          # directly - no daemon, no login for the public packages). Classification follows
          # project-copacetic's ensure-tag-absent.sh: success -> ok, not-found-class errors ->
          # missing, anything else unreachable (retried with exponential backoff). Each attempt is
          # time-bounded (SIGTERM then SIGKILL - buildx traps SIGTERM and would outlive plain
          # `timeout`); "404 not found" also matches the error-text variants of other buildx
          # versions. RECONCILE_RETRIES overrides the retry count (testing/ops knob).
          retries="${RECONCILE_RETRIES:-3}"
          probe() {
            local ref="$1" out attempt=0
            while :; do
              if out=$(timeout -k 10 60 docker buildx imagetools inspect "$ref" 2>&1); then
                echo ok
                return 0
              fi
              if grep -Eiq '(manifest unknown|name unknown|no such manifest|: not found[[:space:]]*$|404 not found)' <<<"$out"; then
                echo missing
                return 0
              fi
              if [ "$attempt" -ge "$retries" ]; then
                echo unreachable
                printf 'probe %s: unclassified failure after %d attempts, last error:\n%s\n' "$ref" "$((attempt + 1))" "$out" >&2
                return 0
              fi
              sleep "$((5 * (2 ** attempt)))"
              attempt=$((attempt + 1))
            done
          }

          version="${VERSION}"
          prefix="${REGISTRY_PREFIX}"
          image_name="${IMAGE_NAME}"
          if [ "${prefix%%/*}" != "ghcr.io" ]; then
            echo "unsupported registry host '${prefix%%/*}' - only ghcr.io reconciliation is implemented" >&2
            exit 1
          fi

          mapfile -t arches < <(jq -r '.[]' <<<"${ARCHITECTURES}")

          declare -A tag_state=()
          missing=()
          for arch in "${arches[@]}"; do
            tag_state["${prefix}/${arch}-${image_name}:${version}"]=$(probe "${prefix}/${arch}-${image_name}:${version}")
          done
          tag_state["${prefix}/${image_name}:${version}"]=$(probe "${prefix}/${image_name}:${version}")

          {
            echo "### Publish reconcile: ${APP} ${version}"
            echo
            echo "| Tag | Status |"
            echo "| --- | --- |"
            for tag in $(printf '%s\n' "${!tag_state[@]}" | sort); do
              echo "| \`${tag}\` | ${tag_state["$tag"]} |"
              if [ "${tag_state["$tag"]}" = "missing" ]; then
                missing+=("$tag")
              fi
              if [ "${tag_state["$tag"]}" = "unreachable" ]; then
                echo "GHCR unreachable while checking ${tag}" >&2
                exit 2
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo
              echo "Dispatching build-app.yaml (app=${APP}, publish=true, ref=main) to publish the missing tags."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "missing tags: ${missing[*]}"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "all ${#tag_state[@]} tags published"
          fi

      - name: Dispatch build-app to publish the missing tags
        if: steps.tags.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-app.yaml --ref main -f app=${{ matrix.app }} -f publish=true
          echo "Dispatched build-app.yaml (app=${{ matrix.app }}, publish=true, ref=main)."
          echo "Its run is the loud signal if publishing keeps failing."
