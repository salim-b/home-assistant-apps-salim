# jactionlint (https://jactionlint.jdx.dev/) configuration - read by the hk `jactionlint` step
# (pre-commit + `mise run lint`) and by editors; picked up automatically from this location.
#
# Profile: default (= actionlint's correctness checks + zizmor-parity regular-persona rules).
# `pedantic` would add auditor-persona noise; revisit after a settle-in period (baseline:
# `jactionlint --baseline-write`).

rules:
  unpinned-uses:
    policies:
      # The home-assistant org's actions intentionally float on a branch - same policy as
      # .github/renovate.json (matchPackageNames home-assistant/** with pinDigests: false).
      # Everything else must be hash-pinned; the workflows digest-pin every other `uses:`.
      home-assistant/*: any
      "*": hash-pin
