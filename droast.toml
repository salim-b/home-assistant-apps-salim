# droast (https://github.com/immanuwell/dockerfile-roast) configuration - read by the hk `droast`
# step (pre-commit + `mise run lint`); failure threshold stays at the default `error`, so
# info-level findings report but do not fail the gate.

skip = [
  # HA app images inherit the runtime identity and init from the base image
  # (ghcr.io/home-assistant/base): s6-overlay runs the rootfs services, so declaring USER/CMD/
