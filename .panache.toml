#:schema https://panache.bz/panache.schema.json

# Markdown formatter + semantic linter (https://panache.bz/reference/configuration.html).
# Panache owns ALL Markdown autoformatting – conventions: .agents/skills/ha-app-markdown.

# Plain GitHub-Flavored Markdown repository.
flavor = "gfm"

# Files kept verbatim for upstream syncs
extend-exclude = [
  "AI_POLICY.md",
  ".agents/skills/entire-address-findings/",
  ".agents/skills/entire-explain/",
  ".agents/skills/entire-recall/",
  ".agents/skills/entire-replay/",
  ".agents/skills/entire-review/",
  ".agents/skills/entire-search/",
  ".agents/skills/entire-session-crosslink/",
  ".agents/skills/entire-session-handoff/",
  ".agents/skills/entire-session-to-skill/",
  ".agents/skills/entire-teach/",
  ".agents/skills/entire-what-happened/",
  ".entire/agent-guide.md",
]

[format]
  # Match rumdl's enforced MD013 limit so the formatter and the second linter agree on what "fits" means.
  line-width = 120
  wrap = "reflow"
