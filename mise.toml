# https://mise.jdx.dev/configuration.html

[env]
DOCKER_BUILDKIT = "1"
# hk: resolve mise environments in hooks (HK_MISE). HK_STASH_UNTRACKED=0 keeps untracked worktree files out of the
# pre-commit stash/restore cycle and skips their discovery (hk docs; `hk check`/`hk check --all` select tracked
# files only in hk 2.7.1 regardless of it - verified with a bait untracked file).
HK_MISE = "1"
HK_STASH_UNTRACKED = "0"

# Task docs: https://mise.jdx.dev/tasks/ – file tasks live in `.mise/tasks/`
[tasks.lint]
description = "Lint all tracked files via hk (same checks as the pre-commit hook)"
run = "hk check --all --no-fail-fast"
output = "interleave"

[tasks.install-git-hooks]
description = "Install hk git hooks user-wide via `~/.gitconfig` (needs Git 2.54+)"
run = """
need=2.54
have=$(git --version | sed 's/^git version //;s/ .*$//')
if [ "$(printf '%s\\n%s\\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
  echo "mise run install-git-hooks: git >= $need required (config-based hooks), found $have" >&2
  exit 1
fi
exec hk install --global --mise
"""
skip_if = """
f="${XDG_CONFIG_HOME:-$HOME/.config}/git/config"; [[ -f "$f" ]] || f="$HOME/.gitconfig"; [[ -f "$f" ]] && rg -q '^\\s*\\[\\s*hook\\s+"hk-[\\w-]+"\\s*\\]' "$f"
"""

[tasks.check]
description = "Run all pre-commit checks (lint + validate)"
depends = ["lint", "validate"]
output = "keep-order"

# Panache owns ALL Markdown autoformatting (.panache.toml, .agents/skills/ha-app-markdown); rumdl stays check-only.
[tasks.fmt]
description = "Auto-format the repository's Markdown via Panache"
run = "panache format ."

[tools]
actionlint = "1.7.12"
editorconfig-checker = "4.0.2"
hadolint = "2.15.1"
# hk's binary pin and the hk@X.Y.Z package imported by hk.pkl must move together (the package provides the builtin
# step definitions the binary executes).
hk = { version = "2.7.1", workflow = "release.yml" }
jq = "1.8.2"
"aqua:jolars/panache" = "3.17.0"
python = "3.15.0"
ripgrep = "15.2.0"
rumdl = "0.3.0"
"aqua:owenlamont/ryl" = "0.26.0"
shellcheck = "0.11.0"
shellharden = "4.3.2"
shfmt = "3.14.1"
uv = "0.13.1"
yq = "4.54.1"

[vars]
# Single source of the supervisor-ref pin the validate task fetches schemas from. Renovate bumps it
# to the newest supervisor release and automerges once CI check is green (.github/renovate.json).
supervisor_ref = "2026.10.2"
