#:schema https://mise.jdx.dev/schema/mise.json

# https://mise.jdx.dev/configuration.html

[env]
  DOCKER_BUILDKIT = "1"
  # hk env knobs (whys: .agents/skills/ha-app-tooling, "Lint gate").
  HK_MISE = "1"
  HK_STASH_UNTRACKED = "0"

# Task docs: https://mise.jdx.dev/tasks/ – file tasks live in `.mise/tasks/`
[tasks.check]
  description = "Run all pre-commit checks (lint + validate)"
  depends = [ "lint", "validate:apps" ]
  output = "keep-order"

[tasks.fmt]
  description = "Auto-format the repository's Markdown (Panache), TOML (tombi) and Python (ruff)"
  run = [ "panache format .", "tombi format .", "ruff format ." ]

[tasks.install-git-hooks]
  description = "Install hk git hooks user-wide via `~/.gitconfig` (needs Git 2.54+)"
  run = """
need=2.54
have=$(git --version | sed 's/^git version //;s/ .*$//')
if [ "$(printf '%s\\n%s\\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
  echo "mise run install-git-hooks: git >= $need required (config-based hooks), found $have" >&2
  exit 1
fi
exec hk install --global --mise
"""
  skip_if = """
f="${XDG_CONFIG_HOME:-$HOME/.config}/git/config"
[[ -f "$f" ]] || f="$HOME/.gitconfig"
[[ -f "$f" ]] && rg -q '^\\s*\\[\\s*hook\\s+"hk-[\\w-]+"\\s*\\]' "$f"
"""

[tasks.lint]
  description = "Lint all tracked files via hk (same checks as the pre-commit hook)"
  run = "hk check --all --no-fail-fast"
  output = "interleave"

[tools]
  "github:immanuwell/dockerfile-roast" = "1.7.0"
  editorconfig-checker = "4.0.2"
  jactionlint = { version = "v2.5.0", workflow = "release.yaml" }
  jq = "1.8.2"
  # hk's binary pin and the hk@X.Y.Z package imported by hk.pkl move together (skill ha-app-tooling, Renovate section).
  hk = { version = "2.12.0", workflow = "release.yml" }
  node = "26.13.1"
  "aqua:jolars/panache" = "3.18.0"
  python = "3.15.2"
  ripgrep = "15.2.0"
  ruff = "0.17.4"
  rumdl = "v0.3.3"
  "aqua:owenlamont/ryl" = "0.29.0"
  shellcheck = "0.11.0"
  shellharden = "4.3.2"
  shfmt = "3.14.1"
  tombi = "1.11.2"
  ty = "0.0.100"
  uv = "0.13.7"
  yq = "4.54.3"
  zizmor = "1.32.0"
  # aube policy exemptions for renovate's tool tree (whys: .agents/skills/ha-app-tooling, Renovate section).
  "npm:renovate" = {
    version = "44.235.0",
    trust_policy_excludes = [ "@yarnpkg/libzip@3.2.2" ],
    allow_builds = [ "re2" ]
  }

[vars]
  # The supervisor-ref pin validate:apps fetches schemas from (Renovate bumps + automerges it).
  supervisor_ref = "2026.11.0"
