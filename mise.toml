# Dev-ops framework: https://mise.jdx.dev

[env]
DOCKER_BUILDKIT = "1"
# hk: resolve mise environments in hooks (HK_MISE) and keep `hk check --all`
# a tracked-files-only gate: untracked files are never selected, while
# unstaged changes stay in place and ARE checked (HK_STASH=git would stash
# them away and lint the index instead - verified with hk 2.7.0).
HK_MISE = "1"
HK_STASH_UNTRACKED = "0"

# Task docs: https://mise.jdx.dev/tasks/ – file tasks live in `.mise/tasks/`
[tasks.lint]
description = "Lint all tracked files via hk (same checks as the pre-commit hook)"
run = "hk check --all --no-fail-fast"
output = "interleave"

# User-wide hook install: hk writes hook.<name>.command entries into
# ~/.gitconfig so every repository on the machine picks them up (silent no-op
# in repos without an hk.pkl). Needs Git 2.54+ (config-based hooks). Run once
# after `mise install --locked`; escape hatch: HK=0 git commit.
[tasks.install-git-hooks]
description = "Install hk git hooks user-wide via ~/.gitconfig (needs Git 2.54+)"
run = """
need=2.54
have=$(git --version | sed 's/^git version //;s/ .*$//')
if [ "$(printf '%s\\n%s\\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
  echo "mise run install-git-hooks: git >= $need required (config-based hooks), found $have" >&2
  exit 1
fi
exec hk install --global --mise
"""

[tasks.check]
description = "Run all pre-commit checks (lint + validate)"
depends = ["lint", "validate"]
output = "keep-order"

# Panache owns ALL Markdown autoformatting (see panache.toml); rumdl stays a
# check-only second linter.
[tasks.fmt]
description = "Auto-format the repository's Markdown via panache"
run = "panache format ."

[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
jq = "1.8.2"
"aqua:jolars/panache" = "3.16.0"
python = "3.14.8"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shellharden = "4.3.2"
shfmt = "3.14.1"
uv = "0.12.23"
yamllint = "1.38.0"
yq = "4.54.1"
hk = { version = "2.7.0", workflow = "release.yml" }

[vars]
# supervisor ref the validate task fetches schemas from (single source of
# the pin). Renovate bumps this to the newest home-assistant/supervisor
# release (github-tags) and automerges when the CI check job is green -
# green means the new schemas still validate our app configs (see
# .github/renovate.json, custom.regex manager).
supervisor_ref = "2026.10.2"
