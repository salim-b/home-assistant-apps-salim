#:schema https://mise.jdx.dev/schema/mise.json

# https://mise.jdx.dev/configuration.html

[env]
  DOCKER_BUILDKIT = "1"
  # hk env knobs (whys: .agents/skills/ha-app-tooling, "Lint gate").
  HK_MISE = "1"
  HK_STASH_UNTRACKED = "0"

# Task docs: https://mise.jdx.dev/tasks/ – file tasks live in `.mise/tasks/`
[tasks.check]
  description = "Run all pre-commit checks (lint + validate)"
  depends = [ "lint", "validate:apps" ]
  output = "keep-order"

[tasks.fmt]
  description = "Auto-format the repository's Markdown (Panache), TOML (Tombi), Python (Ruff), YAML (Ryl) and Dockerfiles (dockerfmt)"
  run = [
    "panache format .",
    "tombi format .",
    "ruff format .",
    "ryl format .",
    # dockerfmt takes file paths (no directory walking), so the file list comes from git
    "git ls-files -z '*Dockerfile' | xargs --null --no-run-if-empty dockerfmt --write",
  ]

[tasks.install-git-hooks]
  description = "Install hk git hooks user-wide via `~/.gitconfig` (needs Git 2.54+)"
  run = """
need=2.54
have=$(git --version | sed 's/^git version //;s/ .*$//')
if [ "$(printf '%s\\n%s\\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
  echo "mise run install-git-hooks: git >= $need required (config-based hooks), found $have" >&2
  exit 1
fi
exec hk install --global --mise
"""
  skip_if = """
f="${XDG_CONFIG_HOME:-$HOME/.config}/git/config"
[[ -f "$f" ]] || f="$HOME/.gitconfig"
[[ -f "$f" ]] && rg -q '^\\s*\\[\\s*hook\\s+"hk-[\\w-]+"\\s*\\]' "$f"
"""

[tasks.lint]
  description = "Lint all tracked files via hk (same checks as the pre-commit hook)"
  run = "hk check --all --no-fail-fast"
  output = "interleave"

# Auto-run `hk fix` on files changed since the last prompt (mise-activated shells only; skipped when git
# rewrote files from commits). hk's step selection (hk.pkl) decides which fix steps apply to each file –
# keep the patterns in sync with hk.pkl's fix-step globs (whys: .agents/skills/ha-app-tooling, "Lint gate").
[[watch_files]]
  patterns = [
    "**/*.md",
    "**/*.markdown",
    "**/*.toml",
    "**/*.py",
    "**/*.yml",
    "**/*.yaml",
    "**/*.sh",
    "**/*.bash",
    "**/*.mksh",
    "**/*.bats",
    "**/*.zsh",
    "**/Dockerfile",
    "**/cont-init.d/*",
    "**/s6-overlay/scripts/*",
    "**/s6-rc.d/*/run",
    "**/s6-rc.d/*/finish",
    "**/rootfs/usr/bin/*",
  ]
  run = '[ -n "$MISE_WATCH_FILES_GIT_REWRITTEN" ] || { IFS=:; hk fix $MISE_WATCH_FILES_MODIFIED; }'

[tools]
  copilot = { version = "v1.0.114", lazy = true }
  "github:immanuwell/dockerfile-roast" = "1.7.0"
  "github:reteps/dockerfmt" = "1.0.0"
  editorconfig-checker = "4.0.2"
  entireio-cli = "0.13.4"
  gh = "2.104.0"
  # Toolchain for the go:-backend build below (mise builds go: tools with the project's go pin).
  go = { version = "1.26", lazy = true }
  # Built from source; upstream external-agents has no tags/releases, so the pin is a commit pseudo-version.
  # Renovate can't bump it (package-path dep of an untagged module) – bump manually, then `mise lock`.
  "go:github.com/entireio/external-agents/agents/entire-agent-goose/cmd/entire-agent-goose" = {
    version = "v0.0.0-20260912195008-9b268b339e17",
    lazy = true,
    lazy_bins = [ "entire-agent-goose" ]
  }
  jactionlint = { version = "v2.6.0", workflow = "release.yaml" }
  jq = "1.8.2"
  # hk's binary pin and the hk@X.Y.Z package imported by hk.pkl move together (skill ha-app-tooling, Renovate section).
  hk = { version = "2.12.0", workflow = "release.yml" }
  node = "26.13.1"
  "aqua:jolars/panache" = "3.18.0"
  python = "3.15.2"
  ripgrep = "15.2.0"
  ruff = "0.17.6"
  rumdl = "v0.3.5"
  "aqua:owenlamont/ryl" = "0.29.0"
  shellcheck = "0.11.0"
  shellharden = "4.3.2"
  shfmt = "3.14.1"
  tombi = "1.11.3"
  ty = "0.0.105"
  uv = "0.13.9"
  vendir = { version = "0.46.3", lazy = true }
  yq = "4.54.3"
  zizmor = "1.33.1"
  # aube policy exemptions for renovate's tool tree (whys: .agents/skills/ha-app-tooling, Renovate section).
  "npm:renovate" = {
    version = "44.252.2",
    trust_policy_excludes = [ "@yarnpkg/libzip@3.2.2" ],
    allow_builds = [ "re2" ]
  }

[vars]
  # The supervisor-ref pin validate:apps fetches schemas from (Renovate bumps + automerges it).
  supervisor_ref = "2026.11.0"
