# Test OPTIONS for the hd-idle app, applied to the device app by
# `mise run test:live hd-idle <host> --test-options` (previous options backed up, restored on exit).
# Top-level keys override the current options; keys not present here are kept.
#
# Safe no-op by design: an empty drive list – the app boots, runs and manages nothing until real
# drives are configured. Device-specific runs do not edit this file: the hook's env knobs generate
# the drive options on the fly (LIVE_HDIDLE_LABEL_GLOB for the target drives, LIVE_HDIDLE_RENAME_DISK
# for the port-move scenario; the knob contract lives in .mise/tasks/test/live/hd-idle.sh's header).
disks: []
