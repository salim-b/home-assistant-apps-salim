# Test OPTIONS for the nfs-server app, applied to the device app by
# `mise run test:live nfs-server <host> --test-options` (previous options backed up, restored on exit).
# Top-level keys override the current options; keys not present here are kept.
#
# Coverage rationale (whole AppArmor profile surface + export-generation paths):
# - /share/nfs          default share; the r/w roundtrip target
# - /share/ro           read-only export: the write must fail with EROFS (per-share options are
#                       enforced at the export boundary)
# - /media/test         second bind-mount source root (/media/** branch of the bind rule)
# - /share/nested/deep  nested share path: two-level mirror directory in the pseudo root
#                       (deepest-first umount ordering, {,/**} glob depth)
# - /share/alt-net      second client network: a second pseudo-root (fsid=0) export line via the
#                       ROOT_NETWORKS dedup; unmountable by design, only export generation is exercised
shares:
  - path: /share/nfs
    network: 192.168.1.0/24
    options: rw,anonuid=1000,anongid=1000,no_subtree_check
  - path: /share/ro
    network: 192.168.1.0/24
    options: ro,no_subtree_check,anonuid=1000,anongid=1000
  - path: /media/test
    network: 192.168.1.0/24
    options: rw,anonuid=1000,anongid=1000,no_subtree_check
  - path: /share/nested/deep
    network: 192.168.1.0/24
    options: rw,anonuid=1000,anongid=1000,no_subtree_check
  - path: /share/alt-net
    network: 10.99.99.0/24
    options: rw,anonuid=1000,anongid=1000,no_subtree_check
