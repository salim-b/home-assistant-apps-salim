# https://contributors.home-assistant.io/apps/reference/configuration/
name: hd-idle
version: "0.1.10"
slug: hd-idle
description: Spin down idle hard disks (USB, SATA) automatically using hd-idle
# Generic image name; CI publishes per-arch images and a multi-arch manifest under this name on pushes to main.
image: "ghcr.io/salim-b/app-hd-idle"
url: "https://github.com/salim-b/home-assistant-apps-salim/tree/main/hd-idle"
panel_icon: mdi:harddisk
arch:
  - aarch64
  - amd64
startup: services
init: false
# CAP_SYS_RAWIO is required for hd-idle's `ata` command type (non-read-safe SCSI passthrough) and must also be
# granted by the AppArmor profile: hd-idle/KNOWLEDGE.md §"SG_IO privileges". Per-drive device access is granted via
# the device-type option fields below.
privileged:
  - SYS_RAWIO
options:
  # Every listed drive follows the global defaults wherever its own fields are empty; idle 0 = never spin down.
  # Unlisted drives are never touched (the global idle is pinned to 0; hd-idle/KNOWLEDGE.md §"Device access in this app").
  disks: []
  default_idle: 600
  default_command_type: scsi
  default_power_condition: 0
  disable_drive_pm: true
  debug: false
  activity_log: false
  ignore_spin_down_detection: false
schema:
  disks:
    # `device` is a supervisor device-type field: a dropdown of block devices with stable by-id paths that ALSO
    # grants the app cgroup access (re-granted on hotplug; system-used devices refused). Select the disk itself,
    # never a partition (a -partN entry grants only the partition node; hd-idle opens the disk node).
    - device: "device(subsystem=block)"
      # Idle time in seconds; 0 = never spin down this drive. Empty = use the default idle time.
      idle: "int(0,)?"
      command_type: "list(scsi|ata)?"
      power_condition: "int(0,15)?"
      # Per-drive override of the global disable_drive_pm: yes = disable this drive's own power management, no =
      # keep it, empty = follow the global setting. A dropdown, not an optional bool: an untouched checkbox is
      # indistinguishable from "off", and bashio's `// empty` cannot tell absent from false
      # (hd-idle/KNOWLEDGE.md §"bashio option parsing (list-of-object options)"); emitted as the drives file's
      # pm-flag column.
      disable_drive_pm: "list(yes|no)?"
  # Global defaults for the per-drive fields left empty. default_idle only applies to LISTED drives (the global
  # idle stays pinned to 0); command type / power condition defaults also seed runtime-appearing drives.
  default_idle: "int(0,)?"
  default_command_type: "list(scsi|ata)"
  default_power_condition: "int(0,15)"
  # DEFAULT for drives whose own disable_drive_pm field is empty; an explicit per-drive yes/no overrides it.
  disable_drive_pm: "bool?"
  debug: "bool?"
  activity_log: "bool?"
  ignore_spin_down_detection: "bool?"
