configuration:
  disks:
    name: Drives
    description: >-
      The drives hd-idle manages. Pick each drive from the dropdown, which
      lists the system's block devices by their stable `/dev/disk/by-id`
      paths. Select the disk itself, never a partition (entries ending in
      `-part...`): the app needs the whole disk.
    fields:
      device:
        name: Device
        description: >-
          The drive to manage. Listing a drive grants the app device access
          to it - also after hotplug, without an app restart. The drive
          Home Assistant runs from is always excluded from spin-down.
      idle:
        name: Idle time (seconds)
        description: |
          Spin the drive down after this many seconds without I/O activity.
          `0` never spins the drive down (excludes the drive).

          An empty value uses the default idle time.

          Tip: manufacturers recommend at least 3-5 minutes - short idle
          times wear drives out faster.
      command_type:
        name: Command type
        description: >-
          How the spin-down command is sent. `scsi` (default) works for
          drives behind a SCSI translation layer - typically all USB drives.
          `ata` is the native ATA command, needed for SATA drives and some
          USB bridges. If a USB drive refuses to spin down with `scsi`, try
          `ata`. An empty value uses the default command type.
      power_condition:
        name: Power condition
        description: >-
          Value sent with the SCSI spin-down command (`0`-`15`). `0` is
          right for nearly all drives. Only real SCSI/SAS drives need other
          values. An empty value uses the default power condition.
  default_idle:
    name: Default idle time (seconds)
    description: >-
      Idle time for drive entries whose own idle field is left empty. `0`
      never spins such drives down. Applies to listed drives only - unlisted
      drives are never spun down.
  default_command_type:
    name: Default command type
    description: >-
      Command type for drives without their own setting. See the per-drive
      command type for details.
  default_power_condition:
    name: Default power condition
    description: >-
      Power condition for drives without their own setting. See the
      per-drive power condition for details.
  disable_drive_pm:
    name: Disable drive power management
    description: >-
      Drives - and some USB bridges - run their own power management and
      can spin themselves up again shortly after a spin-down, invisibly to
      this app. When enabled, the app disables every managed drive's own
      power management (the Advanced Power Management (APM) level and the
      built-in standby timer), so only the configured idle time puts drives
      to sleep. The settings are volatile: they are re-applied at app start
      and whenever a drive (re)appears. A drive or bridge that does not
      support one of the commands logs a one-time failure - harmless.
  debug:
    name: Debug mode
    description: >-
      Verbose hd-idle logging: every monitoring cycle logs each disk's
      state (I/O counters, idle durations, spin-down events). Useful for
      diagnosing drives that won't spin down - and noisy, with log lines
      every few seconds.
  activity_log:
    name: Activity log
    description: >-
      Write hd-idle's activity log to `/data/hd-idle.log` (in the app's
      persistent data directory, so it survives restarts). For every
      completed run-standby-wakeup cycle it records the spin-up time and
      how long the drive had been running or sleeping.
  ignore_spin_down_detection:
    name: Ignore spin-down detection
    description: >-
      Send the spin-down command even when hd-idle thinks the drive is
      already spun down - for drives kept awake by activity hd-idle cannot
      see (for example SMART polling by other tools).

      Caveat: on some USB bridges, re-issuing the command to an
      already-sleeping drive wakes it again - needless spin-up cycles and
      extra wear. Only use this when drives otherwise won't stay spun
      down. This is a global setting; it cannot be set per drive.
