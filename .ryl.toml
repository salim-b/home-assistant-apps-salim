#:schema https://raw.githubusercontent.com/owenlamont/ryl/main/ryl.toml.schema.json

# YAML linter config (hk `ryl` step). https://ryl-docs.pages.dev/config-presets/ – no `extends`, so the
# tables below inline the `default` preset (ryl enables no rules by default) with this repo's overrides
# applied; the override whys: .agents/skills/ha-app-tooling ("YAML linting: ryl").

exclude = [
  ".mise/locks/**",
]

[files]
  yaml = [
    "*.yaml",
    "*.yml",
  ]

[lint.rules]
  anchors = "enable"
  braces = "enable"
  brackets = "enable"
  colons = "enable"
  commas = "enable"
  document-end = "disable"
  empty-lines = "enable"
  empty-values = "disable"
  float-values = "disable"
  hyphens = "enable"
  indentation = "enable"
  key-duplicates = "enable"
  key-ordering = "disable"
  new-line-at-end-of-file = "enable"
  new-lines = "enable"
  octal-values = "disable"
  quoted-strings = "disable"
  trailing-spaces = "enable"

  [lint.rules.line-length]
    level = "warning"
    max = 140

  [lint.rules.document-start]
    level = "warning"
    present = false

  [lint.rules.comments]
    level = "warning"
    min-spaces-from-content = 1

  [lint.rules.comments-indentation]
    level = "warning"

  [lint.rules.truthy]
    level = "warning"
    check-keys = false
