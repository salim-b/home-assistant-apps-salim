# https://contributors.home-assistant.io/apps/reference/configuration/
name: NFS Server
version: "0.7.2"
slug: nfs-server
description: Network File System (NFS) server for Home Assistant
# Generic (multi-arch) image name; CI builds & publishes per-arch images
# (`ghcr.io/salim-b/{amd64,aarch64}-app-nfs-server`) and a multi-arch manifest on pushes to main.
image: "ghcr.io/salim-b/app-nfs-server"
url: "https://github.com/salim-b/home-assistant-apps-salim/tree/main/nfs-server"
panel_icon: mdi:nas
arch:
  - aarch64
  - amd64
startup: services
init: false
# SYS_ADMIN is required to mount the kernel's nfsd filesystem (see
# rootfs/etc/cont-init.d/config.sh); module autoload runs in kernel context,
# so no kernel_modules mapping or SYS_MODULE capability is needed.
privileged:
  - SYS_ADMIN
# AppArmor: the apparmor.txt custom profile is loaded because the file exists
# (device-enforcement-verified); `apparmor` itself defaults to true — grants:
# nfs-server/KNOWLEDGE.md §"AppArmor profile — app-specific grants"
map:
  - media:rw
  - share:rw
ports:
  2049/tcp: 2049
options:
  shares:
    - path: "/share/nfs"
      network: "192.168.1.0/24"
      options: "rw,anonuid=1000,anongid=1000,no_subtree_check"
  default_uid: 1000
  default_gid: 1000
  default_permissions: "755"
  n_threads: 8
  lease_time: 300
schema:
  shares:
    # Defense in depth (the scripts validate the runtime semantics): no whitespace anywhere (/etc/exports entries
    # are whitespace-separated - a newline would inject an extra export line, parsed as root), no backslashes
    # (/proc/mounts and /proc/self/mountinfo escape them as \134 and awk -v processes escapes, so nfsd-apply's
    # mount detection would misjudge them); path: mapped roots only, no empty path components (see DOCS.md);
    # network: exports(5) machine-name charset; options: comma-separated exports(5) tokens, no parentheses.
    # Facts: nfs-server/KNOWLEDGE.md §"Export-cache and fsid semantics"
    - path: "match(^/(share|media)(/[^\\s/\\\\]+)*$)"
      network: "match(^[^\\s()\\\\]+$)"
      options: "match(^[^\\s(),\\\\]+(,[^\\s(),\\\\]+)*$)"
  default_uid: "int(0,)"
  default_gid: "int(0,)"
  default_permissions: "match(^[0-7]{3,4}$)"
  n_threads: "int(1,)"
  lease_time: "int(10,3600)"
  grace_time: "int(10,)?"
