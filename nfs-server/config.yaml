# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: NFS Server
version: "0.2.0"
slug: nfs
description: Network File System (NFS) server for Home Assistant
#image: "ghcr.io/salim-b/{arch}-app-nfs-server"
url: "https://github.com/salim-b/home-assistant-apps-salim/tree/main/nfs-server"
panel_icon: mdi:nas
arch:
  - aarch64
  - amd64
startup: services
init: false
# Map the host's kernel modules into the app (read-only) and grant the
# SYS_MODULE capability so the `nfsd` kernel module can be loaded from within
# the app (see rootfs/etc/cont-init.d/config.sh).
kernel_modules: true
# SYS_ADMIN is required to mount the kernel's nfsd filesystem (see
# rootfs/etc/cont-init.d/config.sh).
privileged:
  - SYS_ADMIN
apparmor: false
map:
  - media:rw
  - share:rw
ports:
  2049/tcp: 2049
options:
  shares:
    - path: "/share/nfs"
      network: "192.168.1.0/24"
      options: "rw,async,anonuid=1000,anongid=1000,pnfs"
  default_uid: 1000
  default_gid: 1000
  default_permissions: "755"
  n_threads: 8
  lease_time: 300
schema:
  shares:
    - path: str
      network: str
      options: str
  default_uid: "int(0,)"
  default_gid: "int(0,)"
  default_permissions: "match(^[0-7]{3,4}$)"
  n_threads: "int(1,)"
  lease_time: "int(10,3600)"
  grace_time: "int(10,)?"
