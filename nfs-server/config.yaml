# https://contributors.home-assistant.io/apps/reference/configuration/
name: NFS Server
version: "0.7.6"
slug: nfs-server
description: Network File System (NFS) server for Home Assistant
# Generic multi-arch manifest name; per-arch image names are derived by CI – repository README §"CI".
image: "ghcr.io/salim-b/app-nfs-server"
url: "https://github.com/salim-b/home-assistant-apps-salim/tree/main/nfs-server"
panel_icon: mdi:nas
arch:
  - aarch64
  - amd64
startup: services
init: false
# SYS_ADMIN is required to mount the kernel's nfsd filesystem (see
# rootfs/etc/cont-init.d/config.sh); module autoload runs in kernel context,
# so no kernel_modules mapping or SYS_MODULE capability is needed.
privileged:
  - SYS_ADMIN
# AppArmor: the apparmor.txt custom profile is loaded because the file exists
# (device-enforcement-verified); `apparmor` itself defaults to true — grants:
# nfs-server/KNOWLEDGE.md §"AppArmor profile — app-specific grants"
map:
  - media:rw
  - share:rw
ports:
  2049/tcp: 2049
options:
  shares:
    - path: "/share/nfs"
      network: "192.168.1.0/24"
      options: "rw,anonuid=1000,anongid=1000,no_subtree_check"
  default_uid: 1000
  default_gid: 1000
  default_permissions: "755"
  n_threads: 8
  lease_time: 300
schema:
  shares:
    # Schema-level defense in depth (the scripts re-validate the runtime semantics): what each field regex blocks
    # and why - nfs-server/KNOWLEDGE.md §"Export-cache and fsid semantics"; path prefixes and empty components: DOCS.md.
    - path: "match(^/(share|media)(/[^\\s/\\\\]+)*$)"
      network: "match(^[^\\s()\\\\]+$)"
      options: "match(^[^\\s(),\\\\]+(,[^\\s(),\\\\]+)*$)"
  default_uid: "int(0,)"
  default_gid: "int(0,)"
  default_permissions: "match(^[0-7]{3,4}$)"
  n_threads: "int(1,)"
  lease_time: "int(10,3600)"
  grace_time: "int(10,)?"
