configuration:
  upstreams:
    name: Upstream resolvers
    description: >-
      Recursive DNS resolvers that queries are forwarded to, queried in the
      given order. Each entry is one resolver with its own fields below.
      IP-address entries with a pinned TLS name are recommended - they need no
      name resolution at app start.
    fields:
      protocol:
        name: Protocol
        description: >-
          How the app talks to this resolver: `tls` (DNS-over-TLS), `quic`
          (DNS-over-QUIC) or `https` (DNS-over-HTTPS). Every upstream connection
          is encrypted - plaintext DNS is not supported.
      host:
        name: Host
        description: >-
          The resolver's DNS name, e.g. `dns.quad9.net`. Required: it is the TLS
          server name the upstream certificate is validated against, so an
          IP-address entry cannot do without it. When `ip` is left empty, this
          name is resolved once at app start (with a last-known-good cache).
      ip:
        name: IP address
        description: >-
          The IPv4 or IPv6 address to connect to, e.g. `9.9.9.9`. Leave empty
          to resolve the host at app start instead; IP-address upstreams are
          recommended - they need no name resolution at all.
      port:
        name: Port
        description: >-
          The resolver's port. Leave empty for the protocol default: 853 for
          `tls` and `quic`, 443 for `https`.
      path:
        name: Path
        description: >-
          HTTP path of the `https` endpoint; ignored by the other protocols.
          Leave empty for the standard `/dns-query`.
  allow_networks:
    name: Allowed networks
    description: >-
      Client access list: only queries from these networks (CIDR notation, e.g.
      `192.168.0.0/16`) are answered, everything else is refused. The defaults
      cover loopback and the private LAN ranges; loopback is always served so
      the app's own health probe works - missing entries are appended at
      startup. Clearing the list entirely allows every client - not recommended
      on a network-exposed host.
  dnssec:
    name: DNSSEC validation
    description: >-
      Cryptographically validate upstream answers against the DNSSEC root
      trust anchors (the root KSKs are embedded in the hickory-dns binary -
      nothing to configure). Bogus answers are rejected. Leave this enabled
      unless a resolver interoperability problem forces you off.
  static_entries:
    name: Static entries
    description: >-
      Local hostname-to-IP answers (hosts.txt-style) served directly by this
      app, never forwarded to an upstream resolver. Each entry becomes its own
      authoritative zone, so it wins over any public record - useful for
      reaching self-hosted services by name from every LAN device. Only A/AAAA
      (address) lookups of the exact hostname are answered; other record types
      get an authoritative empty answer.
    fields:
      hostname:
        name: Hostname
        description: >-
          The fully qualified domain name to answer locally, e.g.
          `nas.lan.example.org`. A bare name like `nas` is treated as the
          top-level name `nas.` and will only match queries for exactly that -
          enter the full name your devices actually look up.
      ip:
        name: IP address
        description: >-
          The IPv4 or IPv6 address the hostname resolves to.
  debug:
    name: Debug mode
    description: >-
      Verbose hickory-dns logging (every query and its handling). Useful for
      diagnosing blocked queries or upstream failures - and noisy under normal
      LAN traffic.
